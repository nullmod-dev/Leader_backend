# Optional alternative to `npm run db`: MongoDB 7 as a single-node replica set
# (transactions need a replica set). Same connection string as config.env:
#   mongodb://127.0.0.1:27017/leader?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - leader-mongo:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  leader-mongo:
